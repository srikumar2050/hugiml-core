[build-system]
requires = ["setuptools>=77", "pybind11>=2.12", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hugiml-core"
version = "1.1.1"
description = "High-performance interpretable rule-based ML — HUG-IML classifier, adaptive binning, EBM-style plots, pattern pruning, and benchmark runner (IEEE Access 2024)."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{ name = "Srikumar Krishnamoorthy" }]
requires-python = ">=3.9"
keywords = [
    "machine-learning",
    "interpretable-ml",
    "interpretable-ai",
    "rule-based",
    "classification",
    "pattern-mining",
    "HUG-IML",
    "high-utility",
    "xai",
]
classifiers = [
	"Development Status :: 5 - Production/Stable", 
	"Intended Audience :: Financial and Insurance Industry", 
	"Intended Audience :: Legal Industry",                 
	"Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "packaging>=21.0",
]

[project.optional-dependencies]
# Visualisation — EBM-style HUG profile plots (Plotly) + adaptive bin charts (matplotlib)
plots = [
    "plotly>=5.0",
    "matplotlib>=3.5",
]

# Benchmark comparison suite (HUG vs EBM / XGBoost / RF / LR / RuleFit / GAM)
# Note: rulefit has only one PyPI release (0.3.1); pin >=0.3, NOT >=0.4.
benchmarks = [
    "xgboost>=1.7",
    "interpret>=0.4",
    "pygam>=0.9",
    "rulefit>=0.3",
]

# Imbalanced-data helpers (SMOTE, RandomUnderSampler, etc.)
imbalanced = [
    "imbalanced-learn>=0.11",
]

dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
    "build",
    "cibuildwheel>=2.20",
    "ruff>=0.4",
    "mypy>=1.8",
    "pandas-stubs",
    "types-setuptools",
    "check-manifest>=0.49",
    "twine>=4.0",
]
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "prometheus-client>=0.19",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
]
explainability = [
    "shap>=0.44",
]
mlflow = [
    "mlflow>=2.10",
]
all = [
    "hugiml-core[dev,plots,benchmarks,imbalanced,telemetry,server,explainability,mlflow]",
]

[project.urls]
Homepage = "https://github.com/srikumar2050/hugiml-core"
Documentation = "https://hugiml-core.readthedocs.io"
Repository = "https://github.com/srikumar2050/hugiml-core"
"Bug Tracker" = "https://github.com/srikumar2050/hugiml-core/issues"
Paper = "https://doi.org/10.1109/ACCESS.2024.3455563"

[project.scripts]
hugiml-bench = "hugiml.benchmarks.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hugiml" = ["py.typed"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux*"
test-command = "python {project}/scripts/wheel_smoke_test.py"
test-requires = ["numpy", "scipy", "scikit-learn", "pandas", "pytest", "packaging"]
build-verbosity = 1


[[tool.cibuildwheel.overrides]]
select = "cp313-manylinux*"
test-requires = ["numpy", "scipy", "scikit-learn>=1.0,<1.8", "pandas", "pytest", "packaging"]

[tool.cibuildwheel.linux]
before-build = "pip install pybind11"
environment = { CC = "gcc", CXX = "g++" }
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
before-build = "pip install pybind11 && brew install libomp || true"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }
repair-wheel-command = "DYLD_LIBRARY_PATH=$(brew --prefix libomp)/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
before-build = "pip install pybind11"
archs = ["AMD64"]

[tool.check-manifest]
ignore = [
    "*.egg-info/*",
    ".github/*",
    ".gitignore",
    "benchmarks/results/*",
    "docker/*",
    "kubernetes/*",
    "scripts/*",
    "native/*.gch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"
markers = [
    "integration: end-to-end tests on real datasets (deselect with '-m not integration')",
    "stress: memory, concurrency and large-batch tests (deselect with '-m not stress')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "always::UserWarning:hugiml",
    # Keep as a single base-class filter; listing subclasses here forces pytest
    # to import hugiml.exceptions before pytest-cov starts tracing, dropping
    # all exception-class lines from coverage.  The base filter is sufficient.
    "ignore::UserWarning:hugiml",
]

# ── Ruff linter ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]
exclude = ["notebooks/"]

# ── Mypy type checker ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_strict_optional = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source_pkgs = ["hugiml"]
omit = ["*/tests/*", "*/benchmarks/*", "*/_compat.py"]
relative_files = true

[tool.coverage.paths]
source = [
    "src/hugiml",
    "*/site-packages/hugiml",
    "*/hugiml/src/hugiml",
]

[tool.coverage.report]
# plots.py is exercised only when plotly is installed (test_plots_* use importorskip).
# Omit from the hard gate; track separately in nightly with [plots] installed.
omit = ["src/hugiml/plots.py"]
fail_under = 73
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
targets = ["src/hugiml"]
exclude_dirs = ["tests", "benchmarks", "scripts", "docker"]
skips = [
    "B101",
    "B324",
    "B603",
    "B607",
]
