[build-system]
requires = ["setuptools>=68,<77", "pybind11>=2.12", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hugiml-core"
version = "1.1.19"
description = "High-performance interpretable rule-based ML — HUG-IML classifier, adaptive binning, EBM-style plots, pattern pruning, and benchmark runner (IEEE Access 2024)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Srikumar Krishnamoorthy" }]
requires-python = ">=3.9"
keywords = [
    "machine-learning",
    "interpretable-ml",
    "interpretable-ai",
    "rule-based",
    "classification",
    "pattern-mining",
    "HUG-IML",
    "high-utility",
    "xai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9,<1.17",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "packaging>=21.0",
]

[project.optional-dependencies]
# Visualisation — EBM-style HUG profile plots (Plotly) + adaptive bin charts (matplotlib)
plots = [
    "plotly>=5.0",
    "matplotlib>=3.5",
]


llm = [
    "streamlit>=1.32",
    "plotly>=5.18",
    "psutil>=5.9",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "pyyaml>=6.0",
]

dashboard = [
    "streamlit>=1.32",
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.18",
    "matplotlib>=3.5",
    "altair>=5.0",
    "jinja2>=3.1",
    "markdown>=3.5",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "xgboost>=1.7",
    "interpret>=0.4",
    "imodels>=2.0",
    "rulefit>=0.3",
    "lightgbm>=4.0",
]

# Benchmark comparison suite (HUG vs EBM / XGBoost / RF / LR / RuleFit / GAM)
# Note: rulefit has only one PyPI release (0.3.1); pin >=0.3, NOT >=0.4.
benchmarks = [
    "xgboost>=1.7",
    "interpret>=0.4",
    "pygam>=0.9",
    "rulefit>=0.3",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
]

# Imbalanced-data helpers (SMOTE, RandomUnderSampler, etc.)
imbalanced = [
    "imbalanced-learn>=0.11",
]

dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
    "build",
    "cibuildwheel>=2.20",
    "ruff>=0.4",
    "mypy>=1.8",
    "pandas-stubs",
    "types-setuptools",
    "check-manifest>=0.49",
    "twine>=4.0",
]
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "prometheus-client>=0.19",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
]
explainability = [
    "shap>=0.44",
]
mlflow = [
    "mlflow>=2.10",
]
all = [
    "hugiml-core[dev,plots,dashboard,benchmarks,imbalanced,telemetry,server,explainability,mlflow,llm]",
]

[project.urls]
Homepage = "https://github.com/srikumar2050/hugiml-core"
Documentation = "https://hugiml-core.readthedocs.io"
Repository = "https://github.com/srikumar2050/hugiml-core"
"Bug Tracker" = "https://github.com/srikumar2050/hugiml-core/issues"
Paper = "https://doi.org/10.1109/ACCESS.2024.3455563"

[project.scripts]
hugiml-bench = "hugiml.benchmarks.runner:main"
hugiml-dashboard = "hugiml.dashboard.launcher:main"
hugiml-llm = "hugiml.llm.cli:main"

[tool.setuptools]
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_LICENSES/*.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hugiml" = ["py.typed"]
"hugiml.llm" = ["assets/datasets/builtin/*.csv", "assets/config/*.yaml"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux*"
test-command = "python {project}/scripts/wheel_smoke_test.py"
test-requires = ["numpy", "scipy", "scikit-learn", "pandas", "pytest", "packaging"]
build-verbosity = 1


[[tool.cibuildwheel.overrides]]
select = "cp313-manylinux*"
test-requires = ["numpy", "scipy", "scikit-learn>=1.0,<1.8", "pandas", "pytest", "packaging"]

[tool.cibuildwheel.linux]
# manylinux_2_28 (AlmaLinux 8-based) ships OpenBLAS for scipy source builds.
# manylinux2014 (CentOS 7) did not include OpenBLAS and is effectively end-of-life.
before-build = "pip install pybind11"
environment = { CC = "gcc", CXX = "g++" }
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
before-build = "pip install pybind11"
before-all = '''
curl -L -o /tmp/openmp.tgz https://mac.r-project.org/openmp/openmp-19.1.5-darwin20-Release.tar.gz
rm -rf /tmp/openmp-root
mkdir -p /tmp/openmp-root
tar -xzf /tmp/openmp.tgz -C /tmp/openmp-root
test -f /tmp/openmp-root/usr/local/include/omp.h
test -f /tmp/openmp-root/usr/local/lib/libomp.dylib
'''
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0", HUGIML_LIBOMP_ROOT = "/tmp/openmp-root/usr/local" }
repair-wheel-command = "DYLD_LIBRARY_PATH=$HUGIML_LIBOMP_ROOT/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
before-build = "pip install pybind11"
archs = ["AMD64"]

[tool.check-manifest]
ignore = [
    "*.egg-info/*",
    ".github/*",
    ".gitignore",
    ".nojekyll",
    "LLM/**",
    "benchmarks/results/*",
    "hugiml_*.html",
    "index.html",
    "native/*.gch",
    "notebooks/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"
markers = [
    "integration: end-to-end tests on real datasets (deselect with '-m not integration')",
    "stress: memory, concurrency and large-batch tests (deselect with '-m not stress')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Single base-class filter: listing subclasses here forces pytest to
    # import hugiml.exceptions before pytest-cov starts tracing, which drops
    # all exception-class lines from coverage.
    "always::UserWarning:hugiml",
]

# ── Ruff linter ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

# ── Mypy type checker ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_strict_optional = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source_pkgs = ["hugiml"]
omit = ["*/tests/*", "*/benchmarks/*", "*/_compat.py", "*/dashboard/*", "*/llm/*"]
relative_files = true

[tool.coverage.paths]
source = [
    "src/hugiml",
    "*/site-packages/hugiml",
    "*/hugiml/src/hugiml",
]

[tool.coverage.report]
# plots.py is exercised only when plotly is installed (test_plots_* use importorskip).
# Omit from the hard gate; track separately in nightly with [plots] installed.
omit = ["src/hugiml/plots.py", "src/hugiml/dashboard/*", "src/hugiml/llm/*"]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
targets = ["src/hugiml"]
exclude_dirs = ["tests", "benchmarks", "scripts", "docker"]
skips = [
    "B101",
    "B324",
    "B603",
    "B607",
]
