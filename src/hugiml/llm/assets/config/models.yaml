# Ollama model recommendations for the optional HUGIML NLP add-on.
# The package never downloads or starts models automatically.
# Deterministic routing is always available.
# Model policy:
#   Default:    qwen3:1.7b
#   Light mode: gemma3:1b
#   Fallback:   llama3.2:1b
profiles:
  no-llm:
    recommended_model: ""
    memory_basis: available_ram_lt_3_5gb
    workspace_mode: deterministic
    max_context_tokens: 0
    planning_mode: deterministic
    branches: 0
    lookahead: 0
    notes: Less than about 3.5 GB free RAM; use deterministic routing without Ollama.
  light-mode:
    recommended_model: gemma3:1b
    memory_basis: available_ram_3_5_to_5gb
    workspace_mode: light_mode
    max_context_tokens: 3072
    planning_mode: validated_llm
    branches: 1
    lookahead: 0
    notes: Lowest-memory Ollama mode for compact grounded answers when memory is tight.
  lightweight-llm:
    recommended_model: qwen3:1.7b
    memory_basis: available_ram_5_to_6gb
    workspace_mode: default_lightweight
    max_context_tokens: 4096
    planning_mode: validated_llm
    branches: 1
    lookahead: 0
    notes: Default local LLM mode for polished grounded answers; deterministic HUGIML execution remains the source of truth.
  fallback-llm:
    recommended_model: llama3.2:1b
    memory_basis: fallback_before_deterministic
    workspace_mode: fallback
    max_context_tokens: 3072
    planning_mode: validated_llm
    branches: 1
    lookahead: 0
    notes: Explicit fallback tried before deterministic routing when the preferred local model fails or is unavailable.
  minimum-llm:
    recommended_model: llama3.2:3b
    memory_basis: available_ram_6_to_10gb
    workspace_mode: minimum_conversational
    max_context_tokens: 4096
    planning_mode: validated_llm
    branches: 1
    lookahead: 0
    notes: Minimum larger local model for a fuller conversational LLM experience.
  balanced:
    recommended_model: qwen3:4b
    memory_basis: available_ram_10_to_16gb
    workspace_mode: balanced
    max_context_tokens: 8192
    planning_mode: validated_llm
    branches: 1
    lookahead: 0
    notes: Good everyday local model for summaries, follow-up questions, and interpretation.
  expanded:
    recommended_model: qwen3:8b
    memory_basis: available_ram_16_to_32gb
    workspace_mode: expanded
    max_context_tokens: 12288
    planning_mode: validated_llm
    branches: 1
    lookahead: 0
    notes: Stronger local model with richer grounded interpretation when more RAM is free.
  large-context:
    recommended_model: gemma3:12b
    memory_basis: available_ram_gte_32gb
    workspace_mode: large_context
    max_context_tokens: 16384
    planning_mode: expanded
    branches: 1
    lookahead: 0
    notes: Long dataset/model-card context and larger one-pass explanations.

models:
  - model: qwen3:1.7b
    label: Qwen3 1.7B
    profile: lightweight-llm
    min_available_gb: 5.0
    max_context_tokens: 4096
    max_output_tokens: 768
    usage: default local LLM
    notes: Default HUGIML local writer/planner for polished grounded answers. Deterministic HUGIML execution remains the source of truth.
  - model: gemma3:1b
    label: Gemma 3 1B
    profile: light-mode
    min_available_gb: 3.5
    max_context_tokens: 3072
    max_output_tokens: 512
    usage: light mode
    notes: Lowest-memory Ollama mode for compact grounded answers when Qwen3 1.7B is too heavy or unavailable.
  - model: llama3.2:1b
    label: Llama 3.2 1B
    profile: fallback-llm
    min_available_gb: 3.5
    max_context_tokens: 3072
    max_output_tokens: 512
    usage: fallback
    notes: Fallback writer/planner tried before deterministic routing when the selected model fails or is unavailable.
  - model: llama3.2:3b
    label: Llama 3.2 3B
    profile: minimum-llm
    min_available_gb: 6.0
    max_context_tokens: 4096
    max_output_tokens: 768
    usage: minimum larger LLM
    notes: Larger fallback option for a fuller conversational HUGIML assistant.
  - model: qwen3:4b
    label: Qwen3 4B
    profile: balanced
    min_available_gb: 10.0
    max_context_tokens: 8192
    max_output_tokens: 1024
    usage: balanced
    notes: Recommended for everyday local NLP workbench use when about 10-16 GB RAM is free.
  - model: gemma3:4b
    label: Gemma 3 4B
    profile: balanced
    min_available_gb: 10.0
    max_context_tokens: 8192
    max_output_tokens: 1024
    usage: balanced alternative
    notes: Alternative 4B-class model for summaries, interpretation, and follow-up questions.
  - model: qwen3:8b
    label: Qwen3 8B
    profile: expanded
    min_available_gb: 16.0
    max_context_tokens: 12288
    max_output_tokens: 1536
    usage: stronger local LLM
    notes: Recommended when about 16-32 GB RAM is free and richer explanations are desired.
  - model: gemma3:12b
    label: Gemma 3 12B
    profile: large-context
    min_available_gb: 32.0
    max_context_tokens: 16384
    max_output_tokens: 2048
    usage: large context
    notes: Largest default recommendation; use only when ample RAM is free.
