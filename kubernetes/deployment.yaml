# HUG-IML inference server — Kubernetes manifests
# ------------------------------------------------
# Applies: Namespace, ConfigMap, Deployment, Service,
#          HorizontalPodAutoscaler, PodDisruptionBudget,
#          NetworkPolicy, PersistentVolumeClaim
#
# Prerequisites:
#   1. Create the HUGIML_API_KEYS secret before applying:
#        kubectl -n hugiml create secret generic hugiml-auth \
#          --from-literal=api-keys="<key1>,<key2>"
#        kubectl -n hugiml create secret generic hugiml-hmac \
#          --from-literal=hmac-key="<hex-encoded-32-byte-key>"
#   2. Replace <YOUR_REGISTRY>/hugiml-core:<TAG> with your image.
#   3. Adjust storageClassName and storage to match your cluster.
#
#   kubectl apply -f kubernetes/deployment.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: hugiml
  labels:
    app.kubernetes.io/name: hugiml-core
    app.kubernetes.io/managed-by: kubectl

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hugiml-config
  namespace: hugiml
data:
  HUGIML_PORT: "8080"
  HUGIML_HOST: "0.0.0.0"
  HUGIML_WORKERS: "1"
  HUGIML_OTEL_ENABLED: "false"
  HUGIML_PROMETHEUS_ENABLED: "true"
  HUGIML_MODEL_PATH: "/models/model.hugiml"
  HUGIML_RATE_LIMIT: "60"
  HUGIML_MAX_BODY_BYTES: "1048576"
  # Require HMAC authentication for all model files in production.
  # The key is injected from the hugiml-hmac Secret below.
  # Unsigned model files will be rejected at load time.
  HUGIML_REQUIRE_MODEL_HMAC: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugiml-server
  namespace: hugiml
  labels:
    app: hugiml-server
    app.kubernetes.io/name: hugiml-core
    app.kubernetes.io/component: inference-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hugiml-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hugiml-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
        # Pin to a specific digest in production; use SHA256 of the image manifest.
        # imageDigest: sha256:<digest>
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: hugiml-server
          # Replace with your registry image and pin to a digest, e.g.:
          # image: ghcr.io/srikumar2050/hugiml-core:2.1.0@sha256:<digest>
          image: <YOUR_REGISTRY>/hugiml-core:<TAG>
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hugiml-config
          env:
            - name: HUGIML_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: hugiml-auth
                  key: api-keys
            - name: HUGIML_MODEL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: hugiml-hmac
                  key: hmac-key
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: model-volume
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: hugiml-model-pvc
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: hugiml-server
  namespace: hugiml
  labels:
    app: hugiml-server
spec:
  selector:
    app: hugiml-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hugiml-server-hpa
  namespace: hugiml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hugiml-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hugiml-server-pdb
  namespace: hugiml
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hugiml-server

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hugiml-server-netpol
  namespace: hugiml
spec:
  podSelector:
    matchLabels:
      app: hugiml-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow outbound to Prometheus scrape targets and model storage if needed.
    # Restrict further to specific CIDR blocks in production.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hugiml-model-pvc
  namespace: hugiml
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
