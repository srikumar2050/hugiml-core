name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/hugiml tests

  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install with dev + plots so plot tests run (not just skip)
      - name: Install package and dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,plots]"

      # Core tests + extension tests (auto-discovered under tests/)
      - name: Run tests
        run: |
          pytest tests/ \
            --cov=hugiml \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  # Quick smoke-test that the wheel installs and imports cleanly
  wheel-smoke:
    name: Wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Explicitly install system build deps — do not rely on runner defaults
      - name: Install system build dependencies
        run: sudo apt-get install -y build-essential libgomp1

      - name: Build wheel
        run: |
          pip install build pybind11
          python -m build --wheel

      - name: Verify wheel contents (benchmarks sub-package present)
        run: |
          unzip -l dist/hugiml_core-*.whl | grep benchmarks
          echo "benchmarks sub-package present in wheel ✓"

      - name: Install wheel and smoke-test
        run: |
          pip install dist/hugiml_core-*.whl
          python -c "from hugiml import HUGIMLClassifierNative; print('core OK')"
          python -c "from hugiml.metrics import compute_all_metrics; print('metrics OK')"
          python -c "from hugiml.pruning import PatternEditor; print('pruning OK')"
          python -c "from hugiml.adaptive import HUGIMLAdaptive; print('adaptive OK')"
          python -c "from hugiml.multiclass import MulticlassHUGReport; print('multiclass OK')"
          python -c "from hugiml.benchmarks.runner import main; print('benchmarks OK')"
          pip install plotly
          python -c "from hugiml.plots import HUGPlotter; print('plots OK')"
          echo "Version: $(python -c 'import hugiml; print(hugiml.__version__)')"
