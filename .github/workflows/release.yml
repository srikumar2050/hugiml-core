# .github/workflows/release.yml
#
# Triggered when a semver tag (e.g. v2.1.0) is pushed.
# Collects all wheels and the sdist built by CI, publishes to PyPI via
# OIDC trusted publishing (no long-lived API tokens required), and signs
# every distribution file with Sigstore.
#
# PyPI trusted publishing setup (one-time):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   Publisher: GitHub Actions — owner: srikumar2050, repo: hugiml-core,
#   workflow: release.yml, environment: pypi

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target: pypi or testpypi"
        required: true
        default: testpypi
        type: choice
        options: [pypi, testpypi]
      run_container_scan:
        description: "Run the advisory Docker image vulnerability scan"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build-wheels:
    name: "Wheels – ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64
          - os: macos-15-intel
            cibw_archs: x86_64
          - os: macos-latest
            cibw_archs: arm64
          - os: windows-latest
            cibw_archs: AMD64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }

      - run: pip install cibuildwheel==2.20.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs || matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build --sdist
      - name: Verify no compiled artefacts in sdist
        run: |
          tar -tzf dist/*.tar.gz | grep -E '\.(so|pyd)$' && \
            { echo "ERROR: compiled artefact found in sdist"; exit 1; } || \
            echo "sdist is clean"
      - name: Verify experiment runners in sdist
        run: |
          archive="$(ls dist/*.tar.gz)"
          tar -tzf "$archive" | grep -E '/experiments/benchmark/benchmark_dashboard\.py$'
          tar -tzf "$archive" | grep -E '/experiments/benchmark/benchmarkREADME\.md$'
          tar -tzf "$archive" | grep -E '/experiments/benchmark/openml_cc18/run_openml_cc18_offline_benchmark\.py$'
          tar -tzf "$archive" | grep -E '/experiments/benchmark/pmlbmini/run_pmlbmini_offline_benchmark\.py$'
          tar -tzf "$archive" | grep -E '/experiments/benchmark/tabzilla/run_tabzilla_offline_benchmark\.py$'
          tar -tzf "$archive" | grep -E '/experiments/benchmark/tabarena/run_tabarena_offline_benchmark\.py$'
          tar -tzf "$archive" | grep -E '/experiments/benchmark/tabarena/tabarena_results/benchmark_results\.json$'
          tar -tzf "$archive" | grep -E '/experiments/scalability/scalability_dashboard\.py$'
          tar -tzf "$archive" | grep -E '/experiments/scalability/scalabilityREADME\.md$'
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build-sdist]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install build
      - name: Generate SBOM
        run: |
          python - << 'EOF'
          import sys, json, time, importlib.metadata as meta
          components = []
          for dep in ["numpy", "scipy", "scikit-learn", "pandas"]:
              try:
                  v = meta.version(dep)
              except Exception:
                  v = "unknown"
              components.append({"name": dep, "version": v, "license": "BSD-3-Clause"})
          sbom = {
              "bomFormat": "CycloneDX-lite",
              "specVersion": "1.4",
              "metadata": {
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "component": {
                      "name": "hugiml-core",
                      "version": "${{ github.ref_name }}",
                      "license": "Apache-2.0",
                  },
              },
              "components": components,
          }
          with open("sbom.json", "w") as f:
              json.dump(sbom, f, indent=2)
          print("SBOM generated")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  container-scan:
    name: Advisory Container Image Scan (Trivy)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_container_scan }}
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [build-wheels]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Linux x86_64 wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest-x86_64
          path: wheelhouse
      - name: Select the CPython 3.12 wheel
        shell: bash
        run: |
          mkdir -p scan-dist
          wheel="$(find wheelhouse -maxdepth 1 -type f \
            -name '*cp312*manylinux*x86_64.whl' -print -quit)"
          if [ -z "$wheel" ]; then
            echo "No CPython 3.12 manylinux x86_64 wheel was found." >&2
            find wheelhouse -maxdepth 1 -type f -print >&2
            exit 1
          fi
          cp "$wheel" scan-dist/
      - name: Build advisory Docker image
        run: |
          docker build \
            --build-arg WHEEL_DIR=scan-dist \
            -f docker/Dockerfile.scan \
            -t hugiml-core:scan-${{ github.sha }} \
            .
      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hugiml-core:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Findings remain visible in the SARIF report but do not prevent a
          # valid Python release. Infrastructure/action failures are also
          # tolerated by the advisory job-level policy above.
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Container scanning is retained as an advisory release job, but Python
    # publication depends only on the build and SBOM jobs.
    needs: [build-wheels, build-sdist, sbom]
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/p/hugiml-core' || 'https://pypi.org/p/hugiml-core' }}
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/

      - name: List dist contents
        run: ls -la dist/

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Sign distributions with Sigstore
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.target == 'pypi'
        uses: sigstore/gh-action-sigstore-python@v3.2.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
          output-directory: signatures/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            signatures/*.sigstore.json
            sbom/sbom.json
          generate_release_notes: true
