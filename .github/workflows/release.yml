# .github/workflows/release.yml
#
# Triggered when a semver tag (e.g. v2.1.0) is pushed.
# Collects all wheels and the sdist built by CI, publishes to PyPI via
# OIDC trusted publishing (no long-lived API tokens required), and signs
# every distribution file with Sigstore.
#
# PyPI trusted publishing setup (one-time):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   Publisher: GitHub Actions — owner: srikumar2050, repo: hugiml-core,
#   workflow: release.yml, environment: pypi

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target: pypi or testpypi"
        required: true
        default: testpypi
        type: choice
        options: [pypi, testpypi]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build-wheels:
    name: "Wheels – ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - run: pip install cibuildwheel==2.20.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_i686"
          CIBW_BEFORE_BUILD_LINUX: "yum install -y ccache || true && pip install pybind11"
          CIBW_BEFORE_BUILD_MACOS: "pip install pybind11 && brew install libomp || true"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install pybind11"
          CIBW_ENVIRONMENT: "CC=gcc CXX=g++"
          CIBW_ENVIRONMENT_MACOS: "CC=gcc CXX=g++ MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "DYLD_LIBRARY_PATH=/usr/local/opt/libomp/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
          CIBW_TEST_REQUIRES: "numpy scipy scikit-learn pandas pytest packaging"
          CIBW_TEST_COMMAND: "python {project}/scripts/wheel_smoke_test.py"
          
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build --sdist
      - name: Verify no compiled artefacts in sdist
        run: |
          tar -tzf dist/*.tar.gz | grep -E '\.(so|pyd)$' && \
            { echo "ERROR: compiled artefact found in sdist"; exit 1; } || \
            echo "sdist is clean"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build-sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build
      - name: Generate SBOM
        run: |
          python - << 'EOF'
          import sys, json, time, importlib.metadata as meta
          components = []
          for dep in ["numpy", "scipy", "scikit-learn", "pandas"]:
              try:
                  v = meta.version(dep)
              except Exception:
                  v = "unknown"
              components.append({"name": dep, "version": v, "license": "BSD-3-Clause"})
          sbom = {
              "bomFormat": "CycloneDX-lite",
              "specVersion": "1.4",
              "metadata": {
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "component": {
                      "name": "hugiml-core",
                      "version": "${{ github.ref_name }}",
                      "license": "Apache-2.0",
                  },
              },
              "components": components,
          }
          with open("sbom.json", "w") as f:
              json.dump(sbom, f, indent=2)
          print("SBOM generated")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json


  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build-wheels]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image for scanning
        run: docker build -f docker/Dockerfile -t hugiml-core:scan-${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hugiml-core:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist, sbom]
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/p/hugiml-core' || 'https://pypi.org/p/hugiml-core' }}
    permissions:
      id-token: write   # OIDC trusted publishing — no stored API token needed
      contents: write   # GitHub release creation
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: List dist contents
        run: ls -la dist/

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: dist/*.whl dist/*.tar.gz

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore.json
            sbom/sbom.json
          generate_release_notes: true
