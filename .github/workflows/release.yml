# .github/workflows/release.yml
#
# Triggered when a semver tag (e.g. v2.1.0) is pushed.
# Collects all wheels and the sdist built by CI, publishes to PyPI via
# OIDC trusted publishing (no long-lived API tokens required), and signs
# every distribution file with Sigstore.
#
# PyPI trusted publishing setup (one-time):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   Publisher: GitHub Actions — owner: srikumar2050, repo: hugiml-core,
#   workflow: release.yml, environment: pypi

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target: pypi or testpypi"
        required: true
        default: testpypi
        type: choice
        options: [pypi, testpypi]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  build-wheels:
    name: "Wheels – ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64
          - os: ubuntu-latest
            cibw_archs: aarch64
          - os: macos-15-intel
            cibw_archs: x86_64
          - os: macos-latest
            cibw_archs: arm64
          - os: windows-latest
            cibw_archs: AMD64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Set up QEMU for Linux ARM64 wheel builds
        if: runner.os == 'Linux' && matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - run: pip install cibuildwheel==2.20.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs || matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build --sdist
      - name: Verify no compiled artefacts in sdist
        run: |
          tar -tzf dist/*.tar.gz | grep -E '\.(so|pyd)$' && \
            { echo "ERROR: compiled artefact found in sdist"; exit 1; } || \
            echo "sdist is clean"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build-sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build
      - name: Generate SBOM
        run: |
          python - << 'EOF'
          import sys, json, time, importlib.metadata as meta
          components = []
          for dep in ["numpy", "scipy", "scikit-learn", "pandas"]:
              try:
                  v = meta.version(dep)
              except Exception:
                  v = "unknown"
              components.append({"name": dep, "version": v, "license": "BSD-3-Clause"})
          sbom = {
              "bomFormat": "CycloneDX-lite",
              "specVersion": "1.4",
              "metadata": {
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "component": {
                      "name": "hugiml-core",
                      "version": "${{ github.ref_name }}",
                      "license": "Apache-2.0",
                  },
              },
              "components": components,
          }
          with open("sbom.json", "w") as f:
              json.dump(sbom, f, indent=2)
          print("SBOM generated")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container-scan:
    name: Container image scan (Trivy)
    # Does not block publish — informational gate only.
    # Any step failure is surfaced as a warning, not a release blocker.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Run after all wheels are built so the linux x86_64 wheel is available
    # as an artifact. We install that pre-built wheel into the image instead
    # of rebuilding the C++ extension from source (which would fail without
    # pybind11 available in the build context).
    needs: [build-wheels]
    permissions:
      contents: read
      # Required for uploading SARIF to the GitHub Security tab.
      # On repos without GitHub Advanced Security the upload step has its own
      # continue-on-error so a missing GHAS licence never blocks the workflow.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Download the pre-built linux x86_64 wheel so the Dockerfile does not
      # need to rebuild the C++ extension (and therefore does not need pybind11).
      - name: Download linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-x86_64
          path: dist/

      # Build a lean scan image that installs the pre-built wheel.
      # This avoids the 'ModuleNotFoundError: No module named pybind11.setup_helpers'
      # error raised when the original multi-stage Dockerfile tries to rebuild
      # the C++ extension inside python:3.12-slim (which has no pybind11).
      - name: Build scan image from pre-built wheel
        run: |
          docker build \
            --build-arg WHEEL_DIR=dist \
            -f docker/Dockerfile.scan \
            -t hugiml-core:scan-${{ github.sha }} \
            .

      # Pin to v0.36.0 (immutable, post-supply-chain-attack, March 2026).
      # DO NOT use @master or any tag < v0.35.0 — those were compromised.
      # exit-code: '0' — scan always succeeds; the SARIF upload and the
      # explicit check step below provide the signal without hard-failing
      # on unfixed OS CVEs in the base image.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hugiml-core:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln

      # Fail explicitly if Trivy found any fixable CRITICAL vulnerabilities
      # in the application layer (not the OS). Uses jq to count results so
      # the threshold is transparent and easy to adjust.
      - name: Check for fixable CRITICAL findings
        run: |
          count=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-results.sarif 2>/dev/null || echo 0)
          echo "Fixable CRITICAL findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::warning::Trivy found $count fixable CRITICAL vulnerabilities. Review the Security tab."
          fi

      # Upload to GitHub Security tab. continue-on-error: true ensures that
      # repos without GitHub Advanced Security (GHAS) do not fail the job —
      # the SARIF artifact is still uploaded below as a fallback.
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Always upload the raw SARIF as a downloadable artifact — available
      # even on repos without GHAS, or when the Security tab upload fails.
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist, sbom]
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/p/hugiml-core' || 'https://pypi.org/p/hugiml-core' }}
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: List dist contents
        run: ls -la dist/

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Sign distributions with Sigstore
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.target == 'pypi'
        uses: sigstore/gh-action-sigstore-python@v3.2.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
          output-directory: signatures/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            signatures/*.sigstore.json
            sbom/sbom.json
          generate_release_notes: true
