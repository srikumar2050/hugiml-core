# Production-ready docker-compose for hugiml-core inference server.
#
# REQUIRED before first run
# ─────────────────────────
# Copy the example env file and fill in real values:
#
#   cp docker/.env.example docker/.env
#
# Mandatory variables in .env (unless HUGIML_AUTH_DISABLED=1):
#   HUGIML_API_KEYS      – comma-separated Bearer tokens.
#   HUGIML_MODEL_HMAC_KEY – 64-char hex HMAC key for model integrity check.
#
# Generate secure values with:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
#
# ── Quick local smoke-test (auth disabled) ────────────────────────────────────
# Models directory must contain model.hugiml.
#
#   HUGIML_AUTH_DISABLED=1 HUGIML_MODEL_DIR=./models docker compose up
#
# Note: server.py checks HUGIML_AUTH_DISABLED (not HUGIML_DISABLE_AUTH).
# Setting HUGIML_DISABLE_AUTH has no effect.
#
# ── Production deployment ─────────────────────────────────────────────────────
#
#   docker compose --env-file docker/.env up -d

version: "3.9"

services:
  hugiml-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hugiml-core:latest
    container_name: hugiml-server
    ports:
      - "127.0.0.1:8080:8080" # loopback only; place a TLS proxy in front
    volumes:
      - ${HUGIML_MODEL_DIR:-./models}:/models:ro
    environment:
      HUGIML_MODEL_PATH: /models/model.hugiml
      # ── Authentication ────────────────────────────────────────────────────
      # server.py reads HUGIML_AUTH_DISABLED (value "1" disables auth).
      # For production, leave unset or "0" and supply HUGIML_API_KEYS.
      HUGIML_AUTH_DISABLED: "${HUGIML_AUTH_DISABLED:-0}"
      # Required when HUGIML_AUTH_DISABLED != "1".
      # The :? syntax makes docker compose fail immediately with a clear error
      # if the variable is absent and auth is not disabled.
      HUGIML_API_KEYS: "${HUGIML_API_KEYS:-}"
      # ── Model HMAC signing ────────────────────────────────────────────────
      HUGIML_MODEL_HMAC_KEY: "${HUGIML_MODEL_HMAC_KEY:-}"
      HUGIML_REQUIRE_MODEL_HMAC: "${HUGIML_REQUIRE_MODEL_HMAC:-true}"
      # ── Observability ─────────────────────────────────────────────────────
      HUGIML_OTEL_ENABLED: "${HUGIML_OTEL_ENABLED:-false}"
      HUGIML_PROMETHEUS_ENABLED: "${HUGIML_PROMETHEUS_ENABLED:-true}"
      # ── Runtime ──────────────────────────────────────────────────────────
      HUGIML_WORKERS: "${HUGIML_WORKERS:-1}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    cap_drop:
      - ALL
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # ── Optional Prometheus scrape target ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: hugiml-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - hugiml-server
    profiles:
      - monitoring
