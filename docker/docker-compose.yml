# Inference service with API authentication and signed model loading.
# From the repository root, copy docker/.env.example to docker/.env,
# supply the API token and the key used when saving model.hugiml, then run:
#   docker compose --env-file docker/.env -f docker/docker-compose.yml up --build -d
# Add --profile monitoring before up to enable Prometheus.

services:
  hugiml-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hugiml-core:latest
    container_name: hugiml-server
    ports:
      - "127.0.0.1:8080:8080" # loopback only; place a TLS proxy in front
    volumes:
      - ${HUGIML_MODEL_DIR:-./models}:/models:ro
    environment:
      HUGIML_MODEL_PATH: /models/model.hugiml
      # ── Authentication ────────────────────────────────────────────────────
      # server.py reads HUGIML_AUTH_DISABLED (value "1" disables auth).
      # For production, leave unset or "0" and supply HUGIML_API_KEYS.
      HUGIML_AUTH_DISABLED: "${HUGIML_AUTH_DISABLED:-0}"
      # Required when HUGIML_AUTH_DISABLED != "1".
      HUGIML_API_KEYS: "${HUGIML_API_KEYS:-}"
      # ── Model HMAC signing ────────────────────────────────────────────────
      HUGIML_MODEL_HMAC_KEY: "${HUGIML_MODEL_HMAC_KEY:-}"
      HUGIML_REQUIRE_MODEL_HMAC: "${HUGIML_REQUIRE_MODEL_HMAC:-true}"
      # ── Observability ─────────────────────────────────────────────────────
      HUGIML_OTEL_ENABLED: "${HUGIML_OTEL_ENABLED:-false}"
      HUGIML_PROMETHEUS_ENABLED: "${HUGIML_PROMETHEUS_ENABLED:-true}"
      # ── Runtime ──────────────────────────────────────────────────────────
      HUGIML_WORKERS: "${HUGIML_WORKERS:-1}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    cap_drop:
      - ALL
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # ── Optional Prometheus scrape target ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: hugiml-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - hugiml-server
    profiles:
      - monitoring
